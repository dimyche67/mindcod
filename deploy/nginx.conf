# /etc/nginx/sites-available/mindcod.ru
# После получения SSL сертификата этот файл будет обновлён автоматически certbot-ом

server {
    listen 80;
    server_name mindcod.ru www.mindcod.ru;

    # Перенаправление на HTTPS после получения SSL
    # Раскомментировать после certbot:
    # return 301 https://$host$request_uri;

    root /var/www/mindcod.ru/dist;
    index index.html;

    # Статика фронтенда — React SPA
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Кэш для бандлов (хеш в имени файла — долгий кэш)
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API backend — проксируем на Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # CORS для внешних форм (submit)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Api-Key";

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Виджет — отдельный путь с открытым CORS
    location /api/integrations/widget.js {
        proxy_pass http://127.0.0.1:8787;
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type "application/javascript";
    }

    client_max_body_size 20m;
}

